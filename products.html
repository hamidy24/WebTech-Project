<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Browse and filter Brutbox and Co men’s essentials.">
  <meta name="theme-color" content="#182536">
  <title>Shop All Products | BRUTBOX &amp; CO.</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>
  <main id="main">
    <section class="page-hero container"><p class="breadcrumb"><a href="index.html">Home</a> / The Collection</p><p class="eyebrow dark">THE SHOP / BRUTBOX &amp; CO.</p><h1>All the essentials.</h1><p>Search by keyword, filter by category, size or colour, and open any product to choose its exact size and colour.</p></section>
    <section class="container shop-shell">
      <form class="filter-bar" id="filter-form" role="search" aria-label="Search and filter products">
        <label>Search<input id="f-q" type="search" placeholder="e.g. wallet, silk, boxer"></label>
        <label>Size<select id="f-size"></select></label>
        <label>Colour<select id="f-color"></select></label>
        <label>Sort by<select id="f-sort"><option value="">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="name">Name A–Z</option></select></label>
      </form>
      <nav class="filter-pills" id="pills" aria-label="Product categories"></nav>
      <div id="catalog" aria-live="polite"></div>
    </section>
  </main>
  <footer class="site-footer" id="site-footer"></footer>
  <script src="js/main.js"></script>
  <script src="js/stock.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
