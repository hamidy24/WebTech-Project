<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#172331"><meta name="description" content="BRUTBOX & CO. men's essentials e-commerce Phase 1 demo"><title>Create Customer Account | BRUTBOX &amp; CO.</title><link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml"><!-- Shared CSS handles the design. Deferred JavaScript order is important: data → store → app → page module. --><link rel="stylesheet" href="css/style.css"><script src="js/data.js" defer></script><script src="js/store.js" defer></script><script src="js/app.js" defer></script><script src="js/auth.js" defer></script></head><body data-area="customer"><a class="skip-link" href="#main">Skip to content</a><div id="site-header"></div><main id="main"><section class="container auth-layout"><aside class="auth-aside"><div><p class="eyebrow">New to the store?</p><h1>Create your<br>demo account.</h1><p>Your saved profile can prefill delivery details when you sign in again.</p></div><p class="small">Demo profile only. Passwords are not stored in this prototype.</p></aside><section class="auth-form-panel"><p class="eyebrow">Customer account</p><h2>Create account</h2><form id="signup-form" class="form-stack"><label>Full name<input name="name" autocomplete="name" required maxlength="80"></label><label>Email address<input name="email" type="email" autocomplete="email" required></label><label>Phone number<input name="phone" type="tel" autocomplete="tel" required maxlength="25"></label><label>Delivery address<textarea name="address" autocomplete="street-address" required maxlength="300"></textarea></label><div class="form-grid two-col"><label>Demo password<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><label>Confirm password<input name="confirmPassword" type="password" minlength="8" autocomplete="new-password" required></label></div><button class="btn btn-dark btn-wide" type="submit">Create demo account</button></form><p class="form-footnote">Already registered? <a class="text-link" href="login.html">Sign in instead</a>.</p></section></section></main><div id="site-footer"></div><div id="toast-region" class="toast-region" aria-live="polite"></div></body></html>
