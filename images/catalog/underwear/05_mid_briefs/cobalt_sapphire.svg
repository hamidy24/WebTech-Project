<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDF3FC"/>
    </radialGradient>
    <linearGradient id="prodGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#2E6FD8"/>
      <stop offset="50%" stop-color="#1B499E"/>
      <stop offset="100%" stop-color="#0F2B63"/>
    </linearGradient>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0,8 L8,0" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="752" height="552" rx="16" fill="none" stroke="#E2DDD3" stroke-width="1.5"/>

  <!-- Top Left Editorial Spec Header -->
  <g transform="translate(48, 52)">
    <rect x="0" y="0" width="92" height="26" rx="5" fill="#182536"/>
    <text x="46" y="17" font-family="'DM Sans', sans-serif" font-size="11" font-weight="800" fill="#C89C68" letter-spacing="1.5" text-anchor="middle">STYLE #05</text>
    <text x="106" y="17" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="2.5">UNDERWEAR</text>
  </g>

  <!-- Top Right Active Shade Swatch Badge -->
  <g transform="translate(560, 52)">
    <rect x="0" y="0" width="192" height="28" rx="14" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.2"/>
    <circle cx="18" cy="14" r="8" fill="#1B499E" stroke="#0F2B63" stroke-width="1"/>
    <text x="34" y="18" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#182536">Cobalt Sapphire</text>
  </g>

  <!-- Main Bespoke Product Studio Render -->
  <g>
    
        <ellipse cx="400" cy="435" rx="170" ry="16" fill="#000" fill-opacity="0.12"/>
        <!-- Low-rise dipped waist -->
        <path d="M225,185 Q400,208 575,185 L582,235 C525,280 462,355 440,400 L360,400 C338,355 275,280 218,235 Z" fill="url(#prodGrad)" stroke="#0F2B63" stroke-width="2"/>
        <path d="M350,192 C350,275 370,395 400,395 C430,395 450,275 450,192" fill="#2E6FD8" fill-opacity="0.18" stroke="#6B9CE8" stroke-width="2.5" stroke-dasharray="5,3"/>
        <path d="M225,160 Q400,183 575,160 L575,190 Q400,213 225,190 Z" fill="#141D2B" stroke="#E5C9A3" stroke-width="1.5"/>
        <text x="400" y="191" font-family="'DM Sans', sans-serif" font-size="10" font-weight="800" fill="#FFFFFF" letter-spacing="3.5" text-anchor="middle">BRUTBOX LOW-RISE</text>
        
  </g>

  <!-- Bottom Studio Spec Caption Bar -->
  <g transform="translate(48, 515)">
    <line x1="0" y1="0" x2="704" y2="0" stroke="#E2DDD3" stroke-width="1.2"/>
    <text x="0" y="26" font-family="'DM Sans', sans-serif" font-size="16" font-weight="800" fill="#182536">Mid-Briefs (Low-Rise Briefs)</text>
    <text x="704" y="26" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#C89C68" letter-spacing="2" text-anchor="end">BRUTBOX &amp; CO. · THE MODERN GENTLEMEN</text>
  </g>
</svg>