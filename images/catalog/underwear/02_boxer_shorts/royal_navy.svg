<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF2F7"/>
    </radialGradient>
    <linearGradient id="prodGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#2B4C7E"/>
      <stop offset="50%" stop-color="#162C4E"/>
      <stop offset="100%" stop-color="#0B182E"/>
    </linearGradient>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0,8 L8,0" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="752" height="552" rx="16" fill="none" stroke="#E2DDD3" stroke-width="1.5"/>

  <!-- Top Left Editorial Spec Header -->
  <g transform="translate(48, 52)">
    <rect x="0" y="0" width="92" height="26" rx="5" fill="#182536"/>
    <text x="46" y="17" font-family="'DM Sans', sans-serif" font-size="11" font-weight="800" fill="#C89C68" letter-spacing="1.5" text-anchor="middle">STYLE #02</text>
    <text x="106" y="17" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="2.5">UNDERWEAR</text>
  </g>

  <!-- Top Right Active Shade Swatch Badge -->
  <g transform="translate(560, 52)">
    <rect x="0" y="0" width="192" height="28" rx="14" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.2"/>
    <circle cx="18" cy="14" r="8" fill="#162C4E" stroke="#0B182E" stroke-width="1"/>
    <text x="34" y="18" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#182536">Royal Navy</text>
  </g>

  <!-- Main Bespoke Product Studio Render -->
  <g>
    
        <ellipse cx="400" cy="465" rx="195" ry="18" fill="#000" fill-opacity="0.12"/>
        <path d="M225,165 L575,165 L605,435 L418,440 L400,320 L382,440 L195,435 Z" fill="url(#prodGrad)" stroke="#0B182E" stroke-width="2"/>
        <!-- Gathered Poplin Pleats -->
        <path d="M280,172 L265,425 M330,172 L320,425 M470,172 L480,425 M520,172 L535,425" stroke="#2B4C7E" stroke-width="1.5" stroke-opacity="0.45"/>
        <!-- Button Fly Placket -->
        <rect x="386" y="172" width="28" height="135" rx="3" fill="#162C4E" stroke="#5B7BA8" stroke-width="2" stroke-dasharray="4,3"/>
        <circle cx="400" cy="210" r="6" fill="#FAF6EE" stroke="#0B182E" stroke-width="1.5"/>
        <circle cx="400" cy="255" r="6" fill="#FAF6EE" stroke="#0B182E" stroke-width="1.5"/>
        <!-- Gathered Elastic Waistband -->
        <rect x="225" y="128" width="350" height="42" rx="5" fill="url(#prodGrad)" stroke="#0B182E" stroke-width="2"/>
        <path d="M245,128 L245,170 M270,128 L270,170 M295,128 L295,170 M505,128 L505,170 M530,128 L530,170 M555,128 L555,170" stroke="#0B182E" stroke-width="1.2" stroke-opacity="0.4"/>
        <rect x="335" y="137" width="130" height="24" rx="3" fill="#141D2B" stroke="#D4AF37" stroke-width="1.2"/>
        <text x="400" y="153" font-family="'DM Sans', sans-serif" font-size="9.5" font-weight="800" fill="#FFFFFF" letter-spacing="2.5" text-anchor="middle">BRUTBOX</text>
        
  </g>

  <!-- Bottom Studio Spec Caption Bar -->
  <g transform="translate(48, 515)">
    <line x1="0" y1="0" x2="704" y2="0" stroke="#E2DDD3" stroke-width="1.2"/>
    <text x="0" y="26" font-family="'DM Sans', sans-serif" font-size="16" font-weight="800" fill="#182536">Boxer Shorts</text>
    <text x="704" y="26" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#C89C68" letter-spacing="2" text-anchor="end">BRUTBOX &amp; CO. · THE MODERN GENTLEMEN</text>
  </g>
</svg>