<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5EFF5"/>
    </radialGradient>
    <linearGradient id="prodGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#6B3869"/>
      <stop offset="50%" stop-color="#461E45"/>
      <stop offset="100%" stop-color="#280E27"/>
    </linearGradient>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0,8 L8,0" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="752" height="552" rx="16" fill="none" stroke="#E2DDD3" stroke-width="1.5"/>

  <!-- Top Left Editorial Spec Header -->
  <g transform="translate(48, 52)">
    <rect x="0" y="0" width="92" height="26" rx="5" fill="#182536"/>
    <text x="46" y="17" font-family="'DM Sans', sans-serif" font-size="11" font-weight="800" fill="#C89C68" letter-spacing="1.5" text-anchor="middle">STYLE #08</text>
    <text x="106" y="17" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="2.5">UNDERWEAR</text>
  </g>

  <!-- Top Right Active Shade Swatch Badge -->
  <g transform="translate(560, 52)">
    <rect x="0" y="0" width="192" height="28" rx="14" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.2"/>
    <circle cx="18" cy="14" r="8" fill="#461E45" stroke="#280E27" stroke-width="1"/>
    <text x="34" y="18" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#182536">Plum Aubergine</text>
  </g>

  <!-- Main Bespoke Product Studio Render -->
  <g>
    
        <ellipse cx="400" cy="445" rx="150" ry="15" fill="#000" fill-opacity="0.12"/>
        <!-- T-Back Rear Strip View Indicator -->
        <path d="M400,170 L400,420" stroke="#280E27" stroke-width="14" stroke-linecap="round" opacity="0.45"/>
        <!-- Minimal Side Straps + Contoured Front Pouch -->
        <path d="M230,168 L570,168 L570,185 L465,215 C455,315 432,418 400,418 C368,418 345,315 335,215 L230,185 Z" fill="url(#prodGrad)" stroke="#280E27" stroke-width="2"/>
        <path d="M350,172 C352,295 375,405 400,405 C425,405 448,295 450,172" fill="none" stroke="#966394" stroke-width="2.2" stroke-dasharray="5,3"/>
        
        <rect x="230" y="135" width="340" height="36" rx="4" fill="#141D2B" stroke="#E5C9A3" stroke-width="1.5"/>
        <line x1="230" y1="143" x2="570" y2="143" stroke="#E5C9A3" stroke-width="1" stroke-opacity="0.6"/>
        <line x1="230" y1="163" x2="570" y2="163" stroke="#E5C9A3" stroke-width="1" stroke-opacity="0.6"/>
        <text x="400" y="157" font-family="'DM Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" letter-spacing="4" text-anchor="middle">BRUTBOX &amp; CO.</text>
    
        
  </g>

  <!-- Bottom Studio Spec Caption Bar -->
  <g transform="translate(48, 515)">
    <line x1="0" y1="0" x2="704" y2="0" stroke="#E2DDD3" stroke-width="1.2"/>
    <text x="0" y="26" font-family="'DM Sans', sans-serif" font-size="16" font-weight="800" fill="#182536">Thong (T-Back)</text>
    <text x="704" y="26" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#C89C68" letter-spacing="2" text-anchor="end">BRUTBOX &amp; CO. · THE MODERN GENTLEMEN</text>
  </g>
</svg>