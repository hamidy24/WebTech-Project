<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF2F7"/>
    </radialGradient>
    <linearGradient id="prodGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#2B4C7E"/>
      <stop offset="50%" stop-color="#162C4E"/>
      <stop offset="100%" stop-color="#0B182E"/>
    </linearGradient>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0,8 L8,0" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="752" height="552" rx="16" fill="none" stroke="#E2DDD3" stroke-width="1.5"/>

  <!-- Top Left Editorial Spec Header -->
  <g transform="translate(48, 52)">
    <rect x="0" y="0" width="92" height="26" rx="5" fill="#182536"/>
    <text x="46" y="17" font-family="'DM Sans', sans-serif" font-size="11" font-weight="800" fill="#C89C68" letter-spacing="1.5" text-anchor="middle">STYLE #06</text>
    <text x="106" y="17" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="2.5">UNDERWEAR</text>
  </g>

  <!-- Top Right Active Shade Swatch Badge -->
  <g transform="translate(560, 52)">
    <rect x="0" y="0" width="192" height="28" rx="14" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.2"/>
    <circle cx="18" cy="14" r="8" fill="#162C4E" stroke="#0B182E" stroke-width="1"/>
    <text x="34" y="18" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#182536">Royal Navy</text>
  </g>

  <!-- Main Bespoke Product Studio Render -->
  <g>
    
        <ellipse cx="400" cy="488" rx="150" ry="14" fill="#000" fill-opacity="0.12"/>
        <path d="M295,120 L505,120 L535,465 L472,465 L412,245 L388,245 L328,465 L265,465 Z" fill="url(#prodGrad)" stroke="#0B182E" stroke-width="2"/>
        <!-- Waffle Thermal Grid Texture & Knee Panels -->
        <path d="M365,120 L365,225 C365,242 435,242 435,225 L435,120" fill="none" stroke="#5B7BA8" stroke-width="2" stroke-dasharray="4,3"/>
        <path d="M282,315 L354,315 M277,355 L345,355 M446,315 L518,315 M455,355 L523,355" stroke="#5B7BA8" stroke-width="2" stroke-dasharray="4,2"/>
        <!-- Ribbed Ankle Cuffs -->
        <rect x="265" y="452" width="63" height="22" rx="3" fill="#141D2B" stroke="#D4AF37" stroke-width="1.5"/>
        <rect x="472" y="452" width="63" height="22" rx="3" fill="#141D2B" stroke="#D4AF37" stroke-width="1.5"/>
        <rect x="295" y="95" width="210" height="28" rx="4" fill="#141D2B" stroke="#D4AF37" stroke-width="1.5"/>
        <text x="400" y="113" font-family="'DM Sans', sans-serif" font-size="9.5" font-weight="800" fill="#FFFFFF" letter-spacing="3" text-anchor="middle">BRUTBOX THERMAL</text>
        
  </g>

  <!-- Bottom Studio Spec Caption Bar -->
  <g transform="translate(48, 515)">
    <line x1="0" y1="0" x2="704" y2="0" stroke="#E2DDD3" stroke-width="1.2"/>
    <text x="0" y="26" font-family="'DM Sans', sans-serif" font-size="16" font-weight="800" fill="#182536">Long Johns / Thermal Bottoms</text>
    <text x="704" y="26" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#C89C68" letter-spacing="2" text-anchor="end">BRUTBOX &amp; CO. · THE MODERN GENTLEMEN</text>
  </g>
</svg>