<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F2F4"/>
    </radialGradient>
    <linearGradient id="prodGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#636B75"/>
      <stop offset="50%" stop-color="#3D434C"/>
      <stop offset="100%" stop-color="#23272E"/>
    </linearGradient>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0,8 L8,0" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="752" height="552" rx="16" fill="none" stroke="#E2DDD3" stroke-width="1.5"/>

  <!-- Top Left Editorial Spec Header -->
  <g transform="translate(48, 52)">
    <rect x="0" y="0" width="92" height="26" rx="5" fill="#182536"/>
    <text x="46" y="17" font-family="'DM Sans', sans-serif" font-size="11" font-weight="800" fill="#C89C68" letter-spacing="1.5" text-anchor="middle">STYLE #03</text>
    <text x="106" y="17" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="2.5">UNDERWEAR</text>
  </g>

  <!-- Top Right Active Shade Swatch Badge -->
  <g transform="translate(560, 52)">
    <rect x="0" y="0" width="192" height="28" rx="14" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.2"/>
    <circle cx="18" cy="14" r="8" fill="#3D434C" stroke="#23272E" stroke-width="1"/>
    <text x="34" y="18" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#182536">Charcoal Slate</text>
  </g>

  <!-- Main Bespoke Product Studio Render -->
  <g>
    
        <ellipse cx="400" cy="465" rx="185" ry="18" fill="#000" fill-opacity="0.12"/>
        <path d="M230,168 L570,168 L592,430 L428,430 L400,325 L372,430 L208,430 Z" fill="url(#prodGrad)" stroke="#23272E" stroke-width="2"/>
        <!-- Contoured Support Pouch & Anti-chafe Flatlock Seams -->
        <path d="M350,170 C342,250 355,325 400,325 C445,325 458,250 450,170" fill="#636B75" fill-opacity="0.18" stroke="#8C95A1" stroke-width="2.5" stroke-dasharray="5,3"/>
        <path d="M295,170 L280,430 M505,170 L520,430" stroke="#8C95A1" stroke-width="2" stroke-dasharray="5,3"/>
        <line x1="208" y1="416" x2="372" y2="416" stroke="#C89C68" stroke-width="2.5"/>
        <line x1="428" y1="416" x2="592" y2="416" stroke="#C89C68" stroke-width="2.5"/>
        
        <rect x="230" y="135" width="340" height="36" rx="4" fill="#141D2B" stroke="#C89C68" stroke-width="1.5"/>
        <line x1="230" y1="143" x2="570" y2="143" stroke="#C89C68" stroke-width="1" stroke-opacity="0.6"/>
        <line x1="230" y1="163" x2="570" y2="163" stroke="#C89C68" stroke-width="1" stroke-opacity="0.6"/>
        <text x="400" y="157" font-family="'DM Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" letter-spacing="4" text-anchor="middle">BRUTBOX &amp; CO.</text>
    
        
  </g>

  <!-- Bottom Studio Spec Caption Bar -->
  <g transform="translate(48, 515)">
    <line x1="0" y1="0" x2="704" y2="0" stroke="#E2DDD3" stroke-width="1.2"/>
    <text x="0" y="26" font-family="'DM Sans', sans-serif" font-size="16" font-weight="800" fill="#182536">Boxer Briefs</text>
    <text x="704" y="26" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#C89C68" letter-spacing="2" text-anchor="end">BRUTBOX &amp; CO. · THE MODERN GENTLEMEN</text>
  </g>
</svg>