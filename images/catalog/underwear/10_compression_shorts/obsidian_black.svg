<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F0EC"/>
    </radialGradient>
    <linearGradient id="prodGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#383D45"/>
      <stop offset="50%" stop-color="#1C2026"/>
      <stop offset="100%" stop-color="#0D0F12"/>
    </linearGradient>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0,8 L8,0" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="752" height="552" rx="16" fill="none" stroke="#E2DDD3" stroke-width="1.5"/>

  <!-- Top Left Editorial Spec Header -->
  <g transform="translate(48, 52)">
    <rect x="0" y="0" width="92" height="26" rx="5" fill="#182536"/>
    <text x="46" y="17" font-family="'DM Sans', sans-serif" font-size="11" font-weight="800" fill="#C89C68" letter-spacing="1.5" text-anchor="middle">STYLE #10</text>
    <text x="106" y="17" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="2.5">UNDERWEAR</text>
  </g>

  <!-- Top Right Active Shade Swatch Badge -->
  <g transform="translate(560, 52)">
    <rect x="0" y="0" width="192" height="28" rx="14" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.2"/>
    <circle cx="18" cy="14" r="8" fill="#1C2026" stroke="#0D0F12" stroke-width="1"/>
    <text x="34" y="18" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#182536">Obsidian Black</text>
  </g>

  <!-- Main Bespoke Product Studio Render -->
  <g>
    
        <ellipse cx="400" cy="480" rx="175" ry="16" fill="#000" fill-opacity="0.12"/>
        <path d="M245,145 L555,145 L578,455 L425,455 L400,295 L375,455 L222,455 Z" fill="url(#prodGrad)" stroke="#0D0F12" stroke-width="2"/>
        <!-- Dynamic Ergonomic Muscle Compression Mapping Panels -->
        <path d="M245,220 Q315,265 310,455" fill="none" stroke="#C89C68" stroke-width="3"/>
        <path d="M555,220 Q485,265 490,455" fill="none" stroke="#C89C68" stroke-width="3"/>
        <path d="M358,148 C352,225 365,295 400,295 C435,295 448,225 442,148" fill="#383D45" fill-opacity="0.2" stroke="#6E7681" stroke-width="2.5" stroke-dasharray="5,3"/>
        <rect x="222" y="440" width="153" height="15" fill="#141D2B"/>
        <rect x="425" y="440" width="153" height="15" fill="#141D2B"/>
        <rect x="245" y="112" width="310" height="35" rx="4" fill="#141D2B" stroke="#C89C68" stroke-width="1.5"/>
        <text x="400" y="134" font-family="'DM Sans', sans-serif" font-size="10" font-weight="800" fill="#C89C68" letter-spacing="3" text-anchor="middle">BRUTBOX PRO COMPRESSION</text>
        
  </g>

  <!-- Bottom Studio Spec Caption Bar -->
  <g transform="translate(48, 515)">
    <line x1="0" y1="0" x2="704" y2="0" stroke="#E2DDD3" stroke-width="1.2"/>
    <text x="0" y="26" font-family="'DM Sans', sans-serif" font-size="16" font-weight="800" fill="#182536">Athletic Compression Shorts</text>
    <text x="704" y="26" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#C89C68" letter-spacing="2" text-anchor="end">BRUTBOX &amp; CO. · THE MODERN GENTLEMEN</text>
  </g>
</svg>