<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F0EC"/>
    </radialGradient>
    <linearGradient id="prodGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#383D45"/>
      <stop offset="50%" stop-color="#1C2026"/>
      <stop offset="100%" stop-color="#0D0F12"/>
    </linearGradient>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0,8 L8,0" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="752" height="552" rx="16" fill="none" stroke="#E2DDD3" stroke-width="1.5"/>

  <!-- Top Left Editorial Spec Header -->
  <g transform="translate(48, 52)">
    <rect x="0" y="0" width="92" height="26" rx="5" fill="#182536"/>
    <text x="46" y="17" font-family="'DM Sans', sans-serif" font-size="11" font-weight="800" fill="#C89C68" letter-spacing="1.5" text-anchor="middle">STYLE #08</text>
    <text x="106" y="17" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="2.5">BOW TIES</text>
  </g>

  <!-- Top Right Active Shade Swatch Badge -->
  <g transform="translate(560, 52)">
    <rect x="0" y="0" width="192" height="28" rx="14" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.2"/>
    <circle cx="18" cy="14" r="8" fill="#1C2026" stroke="#0D0F12" stroke-width="1"/>
    <text x="34" y="18" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#182536">Obsidian Black</text>
  </g>

  <!-- Main Bespoke Product Studio Render -->
  <g>
    
        <ellipse cx="400" cy="435" rx="190" ry="17" fill="#000" fill-opacity="0.14"/>
        <!-- Precision Surgical Steel Collar Clip at Top Center -->
        <rect x="376" y="175" width="48" height="85" rx="8" fill="#CBD5E1" stroke="#475569" stroke-width="2.5"/>
        <circle cx="400" cy="202" r="8" fill="#64748B"/>
        <path d="M384,225 L416,225 M384,238 L416,238" stroke="#475569" stroke-width="2"/>
        <!-- Crisp Formal Clip-On Wings -->
        <path d="M372,268 C315,250 255,212 202,216 C190,255 190,325 202,364 C255,368 315,330 372,312 Z" fill="url(#prodGrad)" stroke="#0D0F12" stroke-width="2.5"/>
        <path d="M428,268 C485,250 545,212 598,216 C610,255 610,325 598,364 C545,368 485,330 428,312 Z" fill="url(#prodGrad)" stroke="#0D0F12" stroke-width="2.5"/>
        
        <path d="M368,275 L300,260 M368,290 L285,290 M368,305 L300,320" stroke="#0D0F12" stroke-width="2.5" stroke-opacity="0.45" stroke-linecap="round"/>
        <path d="M432,275 L500,260 M432,290 L515,290 M432,305 L500,320" stroke="#0D0F12" stroke-width="2.5" stroke-opacity="0.45" stroke-linecap="round"/>
    
        
        <rect x="368" y="252" width="64" height="76" rx="14" fill="url(#prodGrad)" stroke="#0D0F12" stroke-width="2.5"/>
        <path d="M380,256 C388,290 388,290 380,324 M420,256 C412,290 412,290 420,324" stroke="#0D0F12" stroke-width="2" stroke-opacity="0.5"/>
    
        
  </g>

  <!-- Bottom Studio Spec Caption Bar -->
  <g transform="translate(48, 515)">
    <line x1="0" y1="0" x2="704" y2="0" stroke="#E2DDD3" stroke-width="1.2"/>
    <text x="0" y="26" font-family="'DM Sans', sans-serif" font-size="16" font-weight="800" fill="#182536">The Clip-On</text>
    <text x="704" y="26" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#C89C68" letter-spacing="2" text-anchor="end">BRUTBOX &amp; CO. · THE MODERN GENTLEMEN</text>
  </g>
</svg>