<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FAF6EC"/>
    </radialGradient>
    <linearGradient id="prodGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#E6C15C"/>
      <stop offset="50%" stop-color="#B88E28"/>
      <stop offset="100%" stop-color="#7D5D11"/>
    </linearGradient>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0,8 L8,0" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="752" height="552" rx="16" fill="none" stroke="#E2DDD3" stroke-width="1.5"/>

  <!-- Top Left Editorial Spec Header -->
  <g transform="translate(48, 52)">
    <rect x="0" y="0" width="92" height="26" rx="5" fill="#182536"/>
    <text x="46" y="17" font-family="'DM Sans', sans-serif" font-size="11" font-weight="800" fill="#C89C68" letter-spacing="1.5" text-anchor="middle">STYLE #03</text>
    <text x="106" y="17" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="2.5">POCKET SQUARES</text>
  </g>

  <!-- Top Right Active Shade Swatch Badge -->
  <g transform="translate(560, 52)">
    <rect x="0" y="0" width="192" height="28" rx="14" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.2"/>
    <circle cx="18" cy="14" r="8" fill="#B88E28" stroke="#7D5D11" stroke-width="1"/>
    <text x="34" y="18" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#182536">Imperial Gold</text>
  </g>

  <!-- Main Bespoke Product Studio Render -->
  <g>
    
        <polygon points="255,305 355,155 465,305" fill="#7D5D11" stroke="#182536" stroke-width="2"/>
        <polygon points="325,305 445,145 545,305" fill="url(#prodGrad)" stroke="#7D5D11" stroke-width="2.5"/>
        <polyline points="342,305 445,168 528,305" fill="none" stroke="#182536" stroke-width="2.5"/>
        
        <ellipse cx="400" cy="465" rx="185" ry="16" fill="#000" fill-opacity="0.14"/>
        <!-- Suit Jacket Breast Welt Pocket -->
        <rect x="215" y="315" width="370" height="125" rx="6" fill="#182536" stroke="#0F1722" stroke-width="2"/>
        <rect x="205" y="295" width="390" height="32" rx="4" fill="#22334A" stroke="#C89C68" stroke-width="1.5"/>
        <line x1="215" y1="303" x2="585" y2="303" stroke="#C89C68" stroke-width="1" stroke-dasharray="4,3" stroke-opacity="0.7"/>
        <text x="400" y="385" font-family="'DM Sans', sans-serif" font-size="11" font-weight="800" fill="#C89C68" letter-spacing="4" text-anchor="middle">BRUTBOX ATELIER</text>
    
  </g>

  <!-- Bottom Studio Spec Caption Bar -->
  <g transform="translate(48, 515)">
    <line x1="0" y1="0" x2="704" y2="0" stroke="#E2DDD3" stroke-width="1.2"/>
    <text x="0" y="26" font-family="'DM Sans', sans-serif" font-size="16" font-weight="800" fill="#182536">The Two-Point Fold</text>
    <text x="704" y="26" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#C89C68" letter-spacing="2" text-anchor="end">BRUTBOX &amp; CO. · THE MODERN GENTLEMEN</text>
  </g>
</svg>