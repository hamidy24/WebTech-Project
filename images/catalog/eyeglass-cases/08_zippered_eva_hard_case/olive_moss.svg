<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F4EE"/>
    </radialGradient>
    <linearGradient id="prodGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#6A784A"/>
      <stop offset="50%" stop-color="#46522C"/>
      <stop offset="100%" stop-color="#293017"/>
    </linearGradient>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0,8 L8,0" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="752" height="552" rx="16" fill="none" stroke="#E2DDD3" stroke-width="1.5"/>

  <!-- Top Left Editorial Spec Header -->
  <g transform="translate(48, 52)">
    <rect x="0" y="0" width="92" height="26" rx="5" fill="#182536"/>
    <text x="46" y="17" font-family="'DM Sans', sans-serif" font-size="11" font-weight="800" fill="#C89C68" letter-spacing="1.5" text-anchor="middle">STYLE #08</text>
    <text x="106" y="17" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="2.5">EYEGLASS CASES</text>
  </g>

  <!-- Top Right Active Shade Swatch Badge -->
  <g transform="translate(560, 52)">
    <rect x="0" y="0" width="192" height="28" rx="14" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.2"/>
    <circle cx="18" cy="14" r="8" fill="#46522C" stroke="#293017" stroke-width="1"/>
    <text x="34" y="18" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#182536">Olive Moss</text>
  </g>

  <!-- Main Bespoke Product Studio Render -->
  <g>
    <ellipse cx="400" cy="450" rx="215" ry="17" fill="#000" fill-opacity="0.14"/>
        <!-- Tactical Carabiner Clip on Left -->
        <rect x="135" y="255" width="48" height="75" rx="22" fill="none" stroke="#D4AF37" stroke-width="8"/>
        <!-- Molded EVA Shell -->
        <rect x="182" y="195" width="445" height="198" rx="48" fill="url(#prodGrad)" stroke="#293017" stroke-width="3"/>
        <line x1="185" y1="294" x2="624" y2="294" stroke="#D4AF37" stroke-width="6" stroke-dasharray="6,4"/>
        <!-- Molded Shock-Absorbing Ribs -->
        <rect x="245" y="225" width="320" height="32" rx="14" fill="#6A784A" fill-opacity="0.22" stroke="#293017" stroke-width="1.5"/>
        <rect x="245" y="330" width="320" height="32" rx="14" fill="#6A784A" fill-opacity="0.22" stroke="#293017" stroke-width="1.5"/>
        
  </g>

  <!-- Bottom Studio Spec Caption Bar -->
  <g transform="translate(48, 515)">
    <line x1="0" y1="0" x2="704" y2="0" stroke="#E2DDD3" stroke-width="1.2"/>
    <text x="0" y="26" font-family="'DM Sans', sans-serif" font-size="16" font-weight="800" fill="#182536">Zippered Eva Hard Case</text>
    <text x="704" y="26" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#C89C68" letter-spacing="2" text-anchor="end">BRUTBOX &amp; CO. · THE MODERN GENTLEMEN</text>
  </g>
</svg>