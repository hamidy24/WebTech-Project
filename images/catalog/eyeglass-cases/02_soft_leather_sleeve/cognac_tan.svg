<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F9F3EC"/>
    </radialGradient>
    <linearGradient id="prodGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#D18B47"/>
      <stop offset="50%" stop-color="#9E5E24"/>
      <stop offset="100%" stop-color="#66380F"/>
    </linearGradient>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0,8 L8,0" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="752" height="552" rx="16" fill="none" stroke="#E2DDD3" stroke-width="1.5"/>

  <!-- Top Left Editorial Spec Header -->
  <g transform="translate(48, 52)">
    <rect x="0" y="0" width="92" height="26" rx="5" fill="#182536"/>
    <text x="46" y="17" font-family="'DM Sans', sans-serif" font-size="11" font-weight="800" fill="#C89C68" letter-spacing="1.5" text-anchor="middle">STYLE #02</text>
    <text x="106" y="17" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="2.5">EYEGLASS CASES</text>
  </g>

  <!-- Top Right Active Shade Swatch Badge -->
  <g transform="translate(560, 52)">
    <rect x="0" y="0" width="192" height="28" rx="14" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.2"/>
    <circle cx="18" cy="14" r="8" fill="#9E5E24" stroke="#66380F" stroke-width="1"/>
    <text x="34" y="18" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#182536">Cognac Tan</text>
  </g>

  <!-- Main Bespoke Product Studio Render -->
  <g>
    <ellipse cx="400" cy="450" rx="215" ry="17" fill="#000" fill-opacity="0.14"/>
        <!-- Spectacle Frames Peeking Out From Open Top -->
        <circle cx="348" cy="145" r="34" fill="#182536" fill-opacity="0.2" stroke="#D4AF37" stroke-width="5"/>
        <circle cx="452" cy="145" r="34" fill="#182536" fill-opacity="0.2" stroke="#D4AF37" stroke-width="5"/>
        <path d="M382,140 Q400,128 418,140" fill="none" stroke="#D4AF37" stroke-width="4"/>
        <!-- Soft Slip Sleeve -->
        <path d="M285,155 L515,155 L502,420 C502,435 298,435 298,420 Z" fill="url(#prodGrad)" stroke="#66380F" stroke-width="2.5"/>
        <path d="M300,170 L310,412 L490,412 L500,170" fill="none" stroke="#E6B88A" stroke-width="2" stroke-dasharray="5,4"/>
        <text x="400" y="315" font-family="'DM Sans', sans-serif" font-size="10.5" font-weight="800" fill="#F3DFCA" letter-spacing="3" text-anchor="middle">BRUTBOX &amp; CO.</text>
        
  </g>

  <!-- Bottom Studio Spec Caption Bar -->
  <g transform="translate(48, 515)">
    <line x1="0" y1="0" x2="704" y2="0" stroke="#E2DDD3" stroke-width="1.2"/>
    <text x="0" y="26" font-family="'DM Sans', sans-serif" font-size="16" font-weight="800" fill="#182536">Soft Leather Sleeve (Slip Case)</text>
    <text x="704" y="26" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#C89C68" letter-spacing="2" text-anchor="end">BRUTBOX &amp; CO. · THE MODERN GENTLEMEN</text>
  </g>
</svg>