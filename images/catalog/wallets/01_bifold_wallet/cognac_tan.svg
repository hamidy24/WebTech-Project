<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F9F3EC"/>
    </radialGradient>
    <linearGradient id="prodGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#D18B47"/>
      <stop offset="50%" stop-color="#9E5E24"/>
      <stop offset="100%" stop-color="#66380F"/>
    </linearGradient>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0,8 L8,0" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="752" height="552" rx="16" fill="none" stroke="#E2DDD3" stroke-width="1.5"/>

  <!-- Top Left Editorial Spec Header -->
  <g transform="translate(48, 52)">
    <rect x="0" y="0" width="92" height="26" rx="5" fill="#182536"/>
    <text x="46" y="17" font-family="'DM Sans', sans-serif" font-size="11" font-weight="800" fill="#C89C68" letter-spacing="1.5" text-anchor="middle">STYLE #01</text>
    <text x="106" y="17" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="2.5">WALLETS</text>
  </g>

  <!-- Top Right Active Shade Swatch Badge -->
  <g transform="translate(560, 52)">
    <rect x="0" y="0" width="192" height="28" rx="14" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.2"/>
    <circle cx="18" cy="14" r="8" fill="#9E5E24" stroke="#66380F" stroke-width="1"/>
    <text x="34" y="18" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#182536">Cognac Tan</text>
  </g>

  <!-- Main Bespoke Product Studio Render -->
  <g>
    <ellipse cx="400" cy="455" rx="205" ry="17" fill="#000" fill-opacity="0.15"/>
        <!-- Top Billfold Peek -->
        <rect x="205" y="168" width="390" height="22" rx="4" fill="#1B4332" stroke="#66380F" stroke-width="1.5"/>
        <!-- Open Bifold Body -->
        <rect x="190" y="182" width="420" height="235" rx="12" fill="url(#prodGrad)" stroke="#66380F" stroke-width="2.5"/>
        <rect x="202" y="194" width="396" height="211" rx="8" fill="none" stroke="#E6B88A" stroke-width="2" stroke-dasharray="6,4"/>
        <!-- Central Spine Fold -->
        <line x1="400" y1="182" x2="400" y2="417" stroke="#66380F" stroke-width="6" stroke-opacity="0.55"/>
        <!-- Left & Right Card Slots -->
        <path d="M215,245 L380,245 M215,295 L380,295 M215,345 L380,345" stroke="#66380F" stroke-width="2.5"/>
        <path d="M420,245 L585,245 M420,295 L585,295 M420,345 L585,345" stroke="#66380F" stroke-width="2.5"/>
        <text x="502" y="388" font-family="'DM Sans', sans-serif" font-size="10" font-weight="800" fill="#F3DFCA" letter-spacing="2.5" text-anchor="middle">BRUTBOX &amp; CO.</text>
        
  </g>

  <!-- Bottom Studio Spec Caption Bar -->
  <g transform="translate(48, 515)">
    <line x1="0" y1="0" x2="704" y2="0" stroke="#E2DDD3" stroke-width="1.2"/>
    <text x="0" y="26" font-family="'DM Sans', sans-serif" font-size="16" font-weight="800" fill="#182536">Bifold Wallet</text>
    <text x="704" y="26" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#C89C68" letter-spacing="2" text-anchor="end">BRUTBOX &amp; CO. · THE MODERN GENTLEMEN</text>
  </g>
</svg>