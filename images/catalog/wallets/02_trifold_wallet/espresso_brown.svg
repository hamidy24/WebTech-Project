<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5EFEA"/>
    </radialGradient>
    <linearGradient id="prodGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#6E4730"/>
      <stop offset="50%" stop-color="#472A19"/>
      <stop offset="100%" stop-color="#29150A"/>
    </linearGradient>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0,8 L8,0" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="752" height="552" rx="16" fill="none" stroke="#E2DDD3" stroke-width="1.5"/>

  <!-- Top Left Editorial Spec Header -->
  <g transform="translate(48, 52)">
    <rect x="0" y="0" width="92" height="26" rx="5" fill="#182536"/>
    <text x="46" y="17" font-family="'DM Sans', sans-serif" font-size="11" font-weight="800" fill="#C89C68" letter-spacing="1.5" text-anchor="middle">STYLE #02</text>
    <text x="106" y="17" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="2.5">WALLETS</text>
  </g>

  <!-- Top Right Active Shade Swatch Badge -->
  <g transform="translate(560, 52)">
    <rect x="0" y="0" width="192" height="28" rx="14" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.2"/>
    <circle cx="18" cy="14" r="8" fill="#472A19" stroke="#29150A" stroke-width="1"/>
    <text x="34" y="18" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#182536">Espresso Brown</text>
  </g>

  <!-- Main Bespoke Product Studio Render -->
  <g>
    <ellipse cx="400" cy="455" rx="205" ry="17" fill="#000" fill-opacity="0.15"/>
        <rect x="165" y="185" width="470" height="230" rx="10" fill="url(#prodGrad)" stroke="#29150A" stroke-width="2.5"/>
        <rect x="177" y="197" width="446" height="206" rx="6" fill="none" stroke="#946B52" stroke-width="2" stroke-dasharray="5,4"/>
        <!-- Two Vertical Fold Creases Creating Three Sections -->
        <line x1="322" y1="185" x2="322" y2="415" stroke="#29150A" stroke-width="5" stroke-opacity="0.6"/>
        <line x1="478" y1="185" x2="478" y2="415" stroke="#29150A" stroke-width="5" stroke-opacity="0.6"/>
        <path d="M188,245 L308,245 M188,290 L308,290 M188,335 L308,335" stroke="#29150A" stroke-width="2"/>
        <rect x="342" y="225" width="116" height="150" rx="6" fill="#29150A" fill-opacity="0.28" stroke="#C89C68" stroke-width="1.5"/>
        <path d="M492,245 L612,245 M492,290 L612,290 M492,335 L612,335" stroke="#29150A" stroke-width="2"/>
        
  </g>

  <!-- Bottom Studio Spec Caption Bar -->
  <g transform="translate(48, 515)">
    <line x1="0" y1="0" x2="704" y2="0" stroke="#E2DDD3" stroke-width="1.2"/>
    <text x="0" y="26" font-family="'DM Sans', sans-serif" font-size="16" font-weight="800" fill="#182536">Trifold Wallet</text>
    <text x="704" y="26" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#C89C68" letter-spacing="2" text-anchor="end">BRUTBOX &amp; CO. · THE MODERN GENTLEMEN</text>
  </g>
</svg>