<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF5F2"/>
    </radialGradient>
    <linearGradient id="prodGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#236B52"/>
      <stop offset="50%" stop-color="#114734"/>
      <stop offset="100%" stop-color="#08291D"/>
    </linearGradient>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0,8 L8,0" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="752" height="552" rx="16" fill="none" stroke="#E2DDD3" stroke-width="1.5"/>

  <!-- Top Left Editorial Spec Header -->
  <g transform="translate(48, 52)">
    <rect x="0" y="0" width="92" height="26" rx="5" fill="#182536"/>
    <text x="46" y="17" font-family="'DM Sans', sans-serif" font-size="11" font-weight="800" fill="#C89C68" letter-spacing="1.5" text-anchor="middle">STYLE #06</text>
    <text x="106" y="17" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="2.5">WALLETS</text>
  </g>

  <!-- Top Right Active Shade Swatch Badge -->
  <g transform="translate(560, 52)">
    <rect x="0" y="0" width="192" height="28" rx="14" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.2"/>
    <circle cx="18" cy="14" r="8" fill="#114734" stroke="#08291D" stroke-width="1"/>
    <text x="34" y="18" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#182536">Forest Emerald</text>
  </g>

  <!-- Main Bespoke Product Studio Render -->
  <g>
    <ellipse cx="400" cy="455" rx="205" ry="17" fill="#000" fill-opacity="0.15"/>
        <!-- Boarding Pass Peeking Top -->
        <rect x="415" y="92" width="145" height="65" rx="4" fill="#FAF9F5" stroke="#182536" stroke-width="2"/>
        <text x="487" y="118" font-family="monospace" font-size="10" font-weight="700" fill="#182536" text-anchor="middle">BOARDING PASS</text>
        <!-- Extended Passport Folio -->
        <rect x="215" y="120" width="370" height="315" rx="12" fill="url(#prodGrad)" stroke="#08291D" stroke-width="2.5"/>
        <line x1="400" y1="120" x2="400" y2="435" stroke="#08291D" stroke-width="5" stroke-opacity="0.5"/>
        <!-- Passport Crest on Right Sleeve -->
        <circle cx="492" cy="245" r="32" fill="none" stroke="#D4AF37" stroke-width="2"/>
        <text x="492" y="315" font-family="'DM Sans', sans-serif" font-size="11" font-weight="800" fill="#D4AF37" letter-spacing="3" text-anchor="middle">PASSPORT</text>
        <path d="M235,185 L380,185 M235,235 L380,235 M235,285 L380,285" stroke="#08291D" stroke-width="2"/>
        
  </g>

  <!-- Bottom Studio Spec Caption Bar -->
  <g transform="translate(48, 515)">
    <line x1="0" y1="0" x2="704" y2="0" stroke="#E2DDD3" stroke-width="1.2"/>
    <text x="0" y="26" font-family="'DM Sans', sans-serif" font-size="16" font-weight="800" fill="#182536">Travel / Passport Wallet</text>
    <text x="704" y="26" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#C89C68" letter-spacing="2" text-anchor="end">BRUTBOX &amp; CO. · THE MODERN GENTLEMEN</text>
  </g>
</svg>