<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F3F6"/>
    </radialGradient>
    <linearGradient id="prodGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#D0D7DF"/>
      <stop offset="50%" stop-color="#9AA3AE"/>
      <stop offset="100%" stop-color="#626B75"/>
    </linearGradient>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0,8 L8,0" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="752" height="552" rx="16" fill="none" stroke="#E2DDD3" stroke-width="1.5"/>

  <!-- Top Left Editorial Spec Header -->
  <g transform="translate(48, 52)">
    <rect x="0" y="0" width="92" height="26" rx="5" fill="#182536"/>
    <text x="46" y="17" font-family="'DM Sans', sans-serif" font-size="11" font-weight="800" fill="#C89C68" letter-spacing="1.5" text-anchor="middle">STYLE #08</text>
    <text x="106" y="17" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="2.5">WALLETS</text>
  </g>

  <!-- Top Right Active Shade Swatch Badge -->
  <g transform="translate(560, 52)">
    <rect x="0" y="0" width="192" height="28" rx="14" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.2"/>
    <circle cx="18" cy="14" r="8" fill="#9AA3AE" stroke="#626B75" stroke-width="1"/>
    <text x="34" y="18" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#182536">Titanium Silver</text>
  </g>

  <!-- Main Bespoke Product Studio Render -->
  <g>
    <ellipse cx="400" cy="455" rx="205" ry="17" fill="#000" fill-opacity="0.15"/>
        <!-- Tiered Fanned Cards Ejecting From Top -->
        <rect x="295" y="92" width="210" height="90" rx="8" fill="#182536" stroke="#C89C68" stroke-width="1.5" transform="rotate(-4 400 150)"/>
        <rect x="295" y="114" width="210" height="90" rx="8" fill="#6E1423" stroke="#E5C9A3" stroke-width="1.5" transform="rotate(-1 400 150)"/>
        <rect x="295" y="136" width="210" height="90" rx="8" fill="#D4AF37" stroke="#182536" stroke-width="1.5" transform="rotate(2 400 150)"/>
        <!-- Rigid CNC Aluminum Chamber -->
        <rect x="280" y="168" width="240" height="255" rx="12" fill="url(#prodGrad)" stroke="#626B75" stroke-width="3"/>
        <line x1="298" y1="168" x2="298" y2="423" stroke="#D0D7DF" stroke-width="2" stroke-opacity="0.5"/>
        <!-- Bottom Mechanical Ejector Trigger Lever -->
        <rect x="305" y="423" width="58" height="18" rx="5" fill="#D4AF37" stroke="#626B75" stroke-width="2"/>
        <text x="400" y="315" font-family="'DM Sans', sans-serif" font-size="11" font-weight="800" fill="#182536" letter-spacing="3.5" text-anchor="middle">BRUTBOX RFID</text>
        
  </g>

  <!-- Bottom Studio Spec Caption Bar -->
  <g transform="translate(48, 515)">
    <line x1="0" y1="0" x2="704" y2="0" stroke="#E2DDD3" stroke-width="1.2"/>
    <text x="0" y="26" font-family="'DM Sans', sans-serif" font-size="16" font-weight="800" fill="#182536">Pop-Up / Ejector Wallet</text>
    <text x="704" y="26" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#C89C68" letter-spacing="2" text-anchor="end">BRUTBOX &amp; CO. · THE MODERN GENTLEMEN</text>
  </g>
</svg>