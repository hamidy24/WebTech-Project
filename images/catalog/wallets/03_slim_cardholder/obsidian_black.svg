<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2F0EC"/>
    </radialGradient>
    <linearGradient id="prodGrad" x1="15%" y1="10%" x2="85%" y2="90%">
      <stop offset="0%" stop-color="#383D45"/>
      <stop offset="50%" stop-color="#1C2026"/>
      <stop offset="100%" stop-color="#0D0F12"/>
    </linearGradient>
    <pattern id="weave" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0,8 L8,0" stroke="#FFFFFF" stroke-width="0.5" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Studio Backdrop -->
  <rect width="800" height="600" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="752" height="552" rx="16" fill="none" stroke="#E2DDD3" stroke-width="1.5"/>

  <!-- Top Left Editorial Spec Header -->
  <g transform="translate(48, 52)">
    <rect x="0" y="0" width="92" height="26" rx="5" fill="#182536"/>
    <text x="46" y="17" font-family="'DM Sans', sans-serif" font-size="11" font-weight="800" fill="#C89C68" letter-spacing="1.5" text-anchor="middle">STYLE #03</text>
    <text x="106" y="17" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#64748B" letter-spacing="2.5">WALLETS</text>
  </g>

  <!-- Top Right Active Shade Swatch Badge -->
  <g transform="translate(560, 52)">
    <rect x="0" y="0" width="192" height="28" rx="14" fill="#FFFFFF" stroke="#D8D2C5" stroke-width="1.2"/>
    <circle cx="18" cy="14" r="8" fill="#1C2026" stroke="#0D0F12" stroke-width="1"/>
    <text x="34" y="18" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#182536">Obsidian Black</text>
  </g>

  <!-- Main Bespoke Product Studio Render -->
  <g>
    <ellipse cx="400" cy="455" rx="205" ry="17" fill="#000" fill-opacity="0.15"/>
        <!-- Cards Peeking From Top Stash Pocket -->
        <rect x="255" y="152" width="290" height="45" rx="6" fill="#D4AF37" stroke="#0D0F12" stroke-width="1.5"/>
        <rect x="275" y="168" width="250" height="40" rx="6" fill="#182536" stroke="#C89C68" stroke-width="1.5"/>
        <!-- Cardholder Body -->
        <rect x="225" y="192" width="350" height="225" rx="12" fill="url(#prodGrad)" stroke="#0D0F12" stroke-width="2.5"/>
        <rect x="237" y="204" width="326" height="201" rx="8" fill="none" stroke="#6E7681" stroke-width="2" stroke-dasharray="5,4"/>
        <path d="M237,255 L365,255 L400,282 L435,255 L563,255" fill="none" stroke="#0D0F12" stroke-width="2.5"/>
        <path d="M237,315 L365,315 L400,342 L435,315 L563,315" fill="none" stroke="#0D0F12" stroke-width="2.5"/>
        <text x="400" y="385" font-family="'DM Sans', sans-serif" font-size="11" font-weight="800" fill="#C89C68" letter-spacing="3" text-anchor="middle">BRUTBOX &amp; CO.</text>
        
  </g>

  <!-- Bottom Studio Spec Caption Bar -->
  <g transform="translate(48, 515)">
    <line x1="0" y1="0" x2="704" y2="0" stroke="#E2DDD3" stroke-width="1.2"/>
    <text x="0" y="26" font-family="'DM Sans', sans-serif" font-size="16" font-weight="800" fill="#182536">Slim Cardholder</text>
    <text x="704" y="26" font-family="'DM Sans', sans-serif" font-size="11" font-weight="700" fill="#C89C68" letter-spacing="2" text-anchor="end">BRUTBOX &amp; CO. · THE MODERN GENTLEMEN</text>
  </g>
</svg>